training:
  batch_size: 64
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  device: "cuda" # fallback to cpu if not available
  seed: 42

models:
  logistic_regression:
    max_iter: 1000
    C: 1.0
    solver: "lbfgs"
    multi_class: "multinomial"

  random_forest:
    n_estimators: 100
    max_depth: 15
    random_state: 42

  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 5
    random_state: 42

  svm:
    C: 1.0
    kernel: "rbf"
    probability: true

  mlp:
    hidden_dims: [128, 64, 32]
    dropout: 0.3
    num_classes: 5

  1d_cnn:
    conv_channels: [32, 64, 128]
    kernel_sizes: [7, 5, 3]
    fc_dim: 64
    dropout: 0.3
    num_classes: 5

  fft_2d_cnn:
    n_fft: 64
    hop_length: 16
    conv_channels: [16, 32, 64]
    dropout: 0.3
    num_classes: 5

  bilstm:
    hidden_dim: 64
    num_layers: 2
    dropout: 0.3
    bidirectional: true
    num_classes: 5

  cnn_transformer:
    conv_channels: 32
    d_model: 64
    nhead: 4
    num_encoder_layers: 2
    dim_feedforward: 128
    dropout: 0.2
    num_classes: 5

  fusion_model:
    deep_backbone: "1d_cnn"
    handcrafted_feature_dim: 10
    fusion_dim: 64
    num_classes: 5

  autoencoder:
    latent_dim: 16
    encoder_channels: [32, 64]
    num_classes: 5

  heterogeneous_ensemble:
    base_models: ["1d_cnn", "bilstm", "cnn_transformer", "random_forest"]
    voting: "soft"
    num_classes: 5
